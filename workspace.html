<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CodeOS Workspace</title>

    <link rel="stylesheet" href="workspace.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="workspace">
      <!-- Top Bar -->

      <header class="topbar">
        <h1 id="homeButton">💻 CodeOS</h1>

        <div class="toolbar">
          <button id="runBtn">▶ Run</button>
          <button>🐞 Debug</button>
          <button>🤖 AI</button>
          <button id="saveProjectBtn">💾 Save Project</button>
          <button id="loadProjectBtn">📂 Open Project</button>

          <input id="projectPicker" type="file" accept=".codeos" hidden />
          <button>⚙ Settings</button>
        </div>
      </header>

      <!-- Main -->

      <main class="main">
        <!-- Explorer -->

        <aside class="explorer">
          <h3>📁 Explorer</h3>

          <div id="fileList"></div>

          <div class="explorerButtons">
            <button id="newFileBtn">➕ New File</button>

            <button id="newFolderBtn">📁 New Folder</button>

            <button id="deleteFileBtn">🗑 Delete File</button>

            <button id="moveFileBtn">📂 Move File</button>
          </div>
        </aside>

        <!-- Editor -->

        <div class="divider"></div>

        <section class="editor">
          <div class="tabs" id="tabs"></div>

          <textarea spellcheck="false">

// Welcome to CodeOS!

say("Hello World")

    </textarea
          >

          <img id="imagePreview" class="imagePreview" />
        </section>
      </main>

      <!-- Console -->

      <footer class="console">> Console Ready...</footer>
    </div>

    <div id="fileModal" class="modal hidden">
      <div class="modalWindow">
        <h2>📄 Create New File</h2>

        <label>File Name</label>

        <input id="fileName" type="text" placeholder="main" />

        <label>File Type</label>

        <input id="imagePicker" type="file" accept="image/*" class="hidden" />

        <select id="fileType">
          <option value="cdx">CodeOS (.cdx)</option>

          <option value="html">HTML (.html)</option>

          <option value="css">CSS (.css)</option>

          <option value="js">JavaScript (.js)</option>

          <option value="json">JSON (.json)</option>

          <option value="txt">Text (.txt)</option>

          <option value="image">🖼 Image</option>
        </select>

        <div class="modalButtons">
          <button id="cancelFile">Cancel</button>

          <button id="createFile">Create</button>
        </div>
      </div>
    </div>

    <div id="renameModal" class="modal hidden">
      <div class="modalWindow">
        <h2>✏ Rename File</h2>

        <label>New Name</label>

        <input id="renameInput" type="text" placeholder="File name" />

        <div class="modalButtons">
          <button id="cancelRename">Cancel</button>

          <button id="confirmRename">Rename</button>
        </div>
      </div>
    </div>

    <script src="workspace.js"></script>
  </body>
</html>
